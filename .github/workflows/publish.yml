name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for OIDC trusted publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 25 ships npm >= 11.x which supports OIDC trusted publishing
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: oxlint
        run: pnpm lint

      - name: oxfmt check
        run: pnpm fmt:check

      - name: typecheck
        run: pnpm typecheck

      - name: tests
        run: pnpm test

      - name: build
        run: pnpm build

      - name: publish
        # pnpm publish does not support OIDC trusted publishing yet (pnpm/pnpm#9812)
        # Use npm publish directly instead
        run: npm publish --provenance --access public
